<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<title>TENNIS · Multiplayer 3D</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #07080d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #fff; overscroll-behavior: none; }
  body { position: fixed; inset: 0; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ============ LOBBY ============ */
  #lobby { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: radial-gradient(ellipse at 50% 30%, rgba(31,42,72,0.94) 0%, rgba(10,15,30,0.96) 60%, rgba(5,8,17,0.98) 100%);
    padding: 20px; z-index: 30; }
  #lobby.hidden { display: none; }
  .logo {
    font-weight: 900; letter-spacing: 0.18em; font-size: clamp(40px, 9vw, 96px);
    background: linear-gradient(180deg, #ffd166 0%, #f59e0b 50%, #d97706 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 6px 22px rgba(245, 158, 11, 0.35);
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.35));
    animation: logoPulse 2.6s ease-in-out infinite;
  }
  @keyframes logoPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  .tagline { opacity: 0.7; font-size: 13px; margin-top: -8px; letter-spacing: 0.12em; }
  .name-row { display: flex; gap: 8px; align-items: center; }
  .name-row input {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff;
    padding: 10px 14px; border-radius: 12px; font-size: 16px; width: 200px; outline: none;
  }
  .courts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
  .court-card {
    width: 200px; padding: 14px; border-radius: 18px; cursor: pointer; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    border: 2px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.05);
    display: flex; flex-direction: column; gap: 10px;
  }
  .court-card:active { transform: scale(0.97); }
  .court-card.sel { border-color: #ffd166; box-shadow: 0 8px 32px rgba(255, 209, 102, 0.25); }
  .court-thumb { aspect-ratio: 16/10; border-radius: 10px; overflow: hidden; position: relative; }
  .court-thumb canvas { width: 100%; height: 100%; display: block; }
  .court-name { font-weight: 800; letter-spacing: 0.08em; font-size: 14px; }
  .court-desc { font-size: 11px; opacity: 0.7; line-height: 1.4; }
  .enter-btn {
    margin-top: 6px; padding: 16px 28px; border-radius: 14px; border: 0;
    background: linear-gradient(180deg, #06d6a0, #06a886); color: #fff; font-weight: 800; letter-spacing: 0.12em;
    font-size: 17px; box-shadow: 0 8px 26px rgba(6, 214, 160, 0.4); cursor: pointer; min-width: 260px;
  }
  .enter-btn:active { transform: scale(0.97); }
  .enter-btn[disabled] { opacity: 0.5; }
  .lobby-info { display: flex; gap: 16px; opacity: 0.85; font-size: 13px; margin-top: 6px; }
  .lobby-info .dot { width: 8px; height: 8px; background: #06d6a0; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #06d6a0; vertical-align: middle; margin-right: 4px; animation: blink 1.4s infinite; }
  @keyframes blink { 50% { opacity: 0.4; } }
  .share { margin-top: 4px; font-size: 12px; opacity: 0.7; }
  .share code { background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, monospace; color: #ffd166; cursor: pointer; }

  /* ============ HUD ============ */
  #hud { position: absolute; top: env(safe-area-inset-top, 0); left: 0; right: 0; padding: 8px; pointer-events: none; z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .scoreboard {
    background: linear-gradient(180deg, rgba(15,20,40,0.85), rgba(8,12,28,0.85));
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
    padding: 6px 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    display: grid; gap: 6px 10px;
    font-family: ui-monospace, SFMono-Regular, monospace; font-size: 14px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    transform-origin: top center;
  }
  .scoreboard .row { display: contents; }
  .scoreboard .tn { font-weight: 800; letter-spacing: 0.08em; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  .scoreboard .tn.A { color: #74c0fc; }
  .scoreboard .tn.B { color: #ff8787; }
  .scoreboard .cell { text-align: center; opacity: 0.85; }
  .scoreboard .cur { background: rgba(255, 209, 102, 0.18); border-radius: 6px; color: #ffd166; }
  .scoreboard .sets { font-weight: 800; color: #fff; background: rgba(255,255,255,0.08); border-radius: 6px; }
  .scoreboard .pts { min-width: 34px; }
  .scoreboard .head { font-size: 10px; opacity: 0.55; letter-spacing: 0.12em; text-align: center; padding-bottom: 2px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .serve-dot { color: #ffd166; margin-right: 4px; font-size: 10px; vertical-align: middle; animation: blink 1.4s infinite; }
  .meta { display: flex; gap: 12px; font-size: 11px; opacity: 0.6; letter-spacing: 0.08em; text-transform: uppercase; }

  /* ============ ENERGY (SUPER) ============ */
  .energy { position: absolute; left: 50%; transform: translateX(-50%); width: 36%; max-width: 380px; height: 10px;
    background: #131b2e; border: 1px solid rgba(255,255,255,0.14); border-radius: 6px; z-index: 21; pointer-events: none; overflow: hidden; }
  #energyMine { bottom: 12px; }
  #energyOpp { top: 84px; height: 7px; opacity: 0.8; }
  .energy .efill { height: 100%; width: 0%; background: #3a86ff; border-radius: 5px; transition: width 0.2s; }
  .energy.full .efill { background: linear-gradient(90deg, #ff006e, #fb5607, #ffbe0b, #06d6a0, #3a86ff); animation: blink 0.8s infinite; }
  .energy .elabel { position: absolute; inset: 0; font-size: 8px; font-weight: 800; letter-spacing: 0.1em;
    display: flex; align-items: center; justify-content: center; color: #fff; text-shadow: 0 1px 2px #000; font-family: ui-monospace, monospace; }

  /* ============ CONTROLS ============ */
  #joy { position: absolute; left: 20px; bottom: 20px; width: 170px; height: 170px; z-index: 25; }
  .joy-base { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.08), rgba(255,255,255,0.02) 70%); border: 2px dashed rgba(255,255,255,0.18); pointer-events: none; }
  #shots { position: absolute; right: 20px; bottom: 20px; width: 200px; height: 200px; z-index: 25; }
  .sb { position: absolute; width: 78px; height: 78px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 900; color: #fff; font-size: 11px; letter-spacing: 0.08em; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    box-shadow: 0 8px 22px rgba(0,0,0,0.5), inset 0 -4px 8px rgba(0,0,0,0.25), inset 0 2px 4px rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.25); cursor: pointer; transition: transform 0.08s;
    touch-action: none;
  }
  .sb.held { transform: scale(0.92); filter: brightness(1.25); }
  .sb.smash { right: 0; top: 50%; transform: translateY(-50%); background: radial-gradient(circle at 30% 30%, #ff7676, #c92a2a); }
  .sb.lob   { top: 0; left: 50%; transform: translateX(-50%); background: radial-gradient(circle at 30% 30%, #8ce99a, #2f9e44); }
  .sb.drop  { bottom: 0; left: 50%; transform: translateX(-50%); background: radial-gradient(circle at 30% 30%, #fff, #adb5bd); color: #333; text-shadow: 0 1px 2px rgba(255,255,255,0.5); }
  .sb.slice { left: 0; top: 50%; transform: translateY(-50%); background: radial-gradient(circle at 30% 30%, #74c0fc, #1864ab); }
  .sb.smash.held { transform: translateY(-50%) scale(0.92); }
  .sb.lob.held   { transform: translateX(-50%) scale(0.92); }
  .sb.drop.held  { transform: translateX(-50%) scale(0.92); }
  .sb.slice.held { transform: translateY(-50%) scale(0.92); }
  .super-ring { position: absolute; inset: -10px; border-radius: 50%; border: 3px solid; opacity: 0; transition: opacity 0.3s;
    background: conic-gradient(from 0deg, #ff006e, #fb5607, #ffbe0b, #8338ec, #3a86ff, #ff006e);
    -webkit-mask: radial-gradient(circle, transparent 64%, #000 66%, #000 100%);
            mask: radial-gradient(circle, transparent 64%, #000 66%, #000 100%);
    animation: spin 2s linear infinite;
  }
  .super-ready .super-ring { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #shots.hidden { display: none; }

  /* ============ SERVE PANEL ============ */
  #servePanel { position: absolute; right: 18px; bottom: 18px; z-index: 26; display: none;
    flex-direction: column; align-items: stretch; gap: 10px; width: 220px;
    background: linear-gradient(180deg, rgba(15,20,40,0.92), rgba(8,12,28,0.92));
    border: 1px solid rgba(255,255,255,0.14); border-radius: 16px; padding: 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 28px rgba(0,0,0,0.5); }
  #servePanel.show { display: flex; }
  .serve-title { font-size: 11px; letter-spacing: 0.14em; opacity: 0.7; text-align: center; text-transform: uppercase; }
  .serve-types { display: flex; gap: 6px; }
  .serve-type { flex: 1; padding: 9px 4px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.06); font-size: 10px; font-weight: 800; letter-spacing: 0.04em;
    text-align: center; cursor: pointer; line-height: 1.3; color: #fff; transition: transform 0.1s, border-color 0.12s; }
  .serve-type small { display: block; font-size: 8px; font-weight: 600; opacity: 0.6; letter-spacing: 0; }
  .serve-type.sel { border-color: #ffd166; background: rgba(255,209,102,0.18); color: #ffd166; }
  .serve-type:active { transform: scale(0.95); }
  .serve-power { position: relative; height: 16px; border-radius: 8px; overflow: hidden;
    background: #14203a; border: 1px solid rgba(255,255,255,0.12); }
  .serve-power-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: linear-gradient(90deg, #06d6a0, #ffd166, #ff4444); transition: width 0.04s linear; }
  .serve-sweet { position: absolute; top: 0; bottom: 0; left: 64%; width: 32%;
    background: rgba(6,214,160,0.30); border-left: 1px solid rgba(255,255,255,0.6); border-right: 1px solid rgba(255,255,255,0.6); }
  .serve-go { padding: 14px; border-radius: 12px; border: 0; cursor: pointer; touch-action: none; user-select: none;
    background: linear-gradient(180deg, #06d6a0, #06a886); color: #fff; font-weight: 900; letter-spacing: 0.1em;
    font-size: 15px; box-shadow: 0 6px 18px rgba(6,214,160,0.4); }
  .serve-go.held { transform: scale(0.96); filter: brightness(1.2); }
  .serve-hint { font-size: 9px; opacity: 0.55; text-align: center; letter-spacing: 0.04em; }

  /* ============ EMOTES ============ */
  #emotes { position: absolute; top: env(safe-area-inset-top, 0); right: 8px; display: flex; flex-direction: column; gap: 6px; padding: 8px; z-index: 22; }
  .emote {
    width: 56px; padding: 6px 0; text-align: center; border-radius: 10px;
    background: rgba(15,20,40,0.7); border: 1px solid rgba(255,255,255,0.12);
    font-size: 11px; font-weight: 700; color: #fff; cursor: pointer; backdrop-filter: blur(8px);
  }
  .emote:active { transform: scale(0.92); background: rgba(255, 209, 102, 0.25); }

  /* ============ TOAST / overlays ============ */
  #toast { position: absolute; top: 30%; left: 0; right: 0; text-align: center; z-index: 28; pointer-events: none;
    font-weight: 900; font-size: 64px; letter-spacing: 0.1em;
    color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,0.6);
    opacity: 0; transition: opacity 0.2s, transform 0.2s; transform: scale(0.7);
  }
  #toast.show { opacity: 1; transform: scale(1); }
  #toast.gold { background: linear-gradient(180deg, #fff7d6, #ffd166 50%, #f59e0b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #toast.red { color: #ff5252; }
  #toast.blue { color: #74c0fc; }
  #toast.orange { color: #ff9f43; }

  #flash { position: absolute; inset: 0; pointer-events: none; background: white; opacity: 0; z-index: 27; transition: opacity 0.2s; }
  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 26; box-shadow: inset 0 0 0 0 transparent; transition: box-shadow 0.2s; }

  #connInfo { position: absolute; top: env(safe-area-inset-top, 0); left: 8px; font-size: 10px; opacity: 0.45; z-index: 21; pointer-events: none; font-family: ui-monospace, monospace; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="lobby">
  <div class="logo">TENNIS</div>
  <div class="tagline">MULTIPLAYER · 3D · STADIO NOTTURNO</div>
  <div class="name-row">
    <input id="nameIn" placeholder="Il tuo nome" maxlength="14">
  </div>
  <div class="courts" id="courts"></div>
  <button class="enter-btn" id="enterBtn">ENTRA IN PARTITA</button>
  <div class="lobby-info">
    <span><span class="dot"></span><span id="lobbyCount">0</span> giocatori</span>
    <span>Modalità: <b id="lobbyMode">1v1</b></span>
  </div>
  <div class="share">Condividi: <code id="shareUrl" onclick="navigator.clipboard&&navigator.clipboard.writeText(this.textContent)">...</code></div>
</div>

<div id="hud"></div>
<div id="connInfo"></div>
<div id="energyMine" class="energy"><div class="efill"></div><span class="elabel">SUPER</span></div>
<div id="energyOpp" class="energy"><div class="efill"></div></div>

<div id="joy"><div class="joy-base"></div></div>
<div id="shots">
  <div class="super-ring"></div>
  <div class="sb smash" data-shot="drive">SMASH</div>
  <div class="sb lob" data-shot="lob">LOB</div>
  <div class="sb drop" data-shot="drop">DROP</div>
  <div class="sb slice" data-shot="slice">SLICE</div>
</div>
<div id="servePanel">
  <div class="serve-title">Servizio</div>
  <div class="serve-types">
    <div class="serve-type sel" data-serve="flat">PIATTO<small>veloce</small></div>
    <div class="serve-type" data-serve="slice">SLICE<small>curvo</small></div>
    <div class="serve-type" data-serve="kick">KICK<small>rimbalzo</small></div>
  </div>
  <div class="serve-power"><div class="serve-sweet"></div><div class="serve-power-fill" id="servePowerFill"></div></div>
  <button class="serve-go" id="serveGo">TIENI PER CARICARE</button>
  <div class="serve-hint">Rilascia sulla zona chiara per servire preciso</div>
</div>
<div id="emotes">
  <div class="emote" data-key="mine">Mia!</div>
  <div class="emote" data-key="nice">Grande!</div>
  <div class="emote" data-key="no">Nooo!</div>
  <div class="emote" data-key="go">Dai!</div>
</div>

<div id="toast"></div>
<div id="flash"></div>
<div id="vignette"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/vendor/nipplejs.min.js"></script>
<script src="/vendor/three.min.js"></script>
<script>
'use strict';

// =========================================================================
// Costanti condivise col server (devono combaciare!)
// =========================================================================
const COURT = {
  DOUBLES_HALF_W: 5.485,
  SINGLES_HALF_W: 4.115,
  BASELINE_Z: 11.885,
  SERVICE_Z: 6.4,
  NET_H_CENTER: 0.91,
  NET_H_POST: 1.07,
  NET_OVERHANG: 0.914,
};

const COURT_THEMES = {
  clay: {
    base: '#b34a22', baseDark: '#7e3514', apron: '#5e2810', line: '#fff6e6',
    particle: ['#c2552a', '#8b3a1a', '#e07b4a', '#a83e16'],
    name: 'TERRA ROSSA', desc: 'Scivolata vistosa · rimbalzo alto · palla che rallenta',
  },
  grass: {
    base: '#2e8b43', baseDark: '#1f6630', apron: '#16441f', line: '#ffffff',
    particle: ['#5fbf6f', '#2a7a3a', '#7fd190', '#4a9a5a'],
    name: 'ERBA', desc: 'Grip totale · cambi fulminei · palla che schizza bassa',
  },
  hard: {
    base: '#2456a8', baseDark: '#173a75', apron: '#10264d', line: '#ffffff',
    particle: ['#90a3c0', '#b0c0d8', '#7090b0', '#a0b0c8'],
    name: 'CEMENTO', desc: 'Bilanciato · rimbalzo medio · velocità media',
  },
};

const TEAM_COLOR = {
  A: { main: '#3a86ff', dark: '#1d4ed8', light: '#74c0fc' },
  B: { main: '#ff4444', dark: '#b91c1c', light: '#ff8787' },
};

const SHOT_COLORS = { drive: '#ff6b6b', smash: '#ff3030', lob: '#69db7c', drop: '#ffffff', slice: '#74c0fc', serve: '#ffd166', volley: '#ffe066' };

// =========================================================================
// Socket + stato di rete
// =========================================================================
const socket = io({ transports: ['websocket', 'polling'] });
let myId = null;
let myTeam = 'A';
let serverState = null;
let lastState = null;
let nextState = null;
let stateRecvT = 0;
let stateInterval = 1000 / 30;

const connInfo = document.getElementById('connInfo');

socket.on('connect', () => {
  myId = socket.id;
  connInfo.textContent = 'connesso · ' + myId.slice(0, 6);
});
socket.on('hello', (d) => {
  document.getElementById('shareUrl').textContent = location.href.split('?')[0];
  if (d.canPickCourt === false) {
    selectedCourt = d.court || 'hard';
    renderCourtCards();
  }
});
socket.on('lobby', (d) => {
  document.getElementById('lobbyCount').textContent = d.count;
  document.getElementById('lobbyMode').textContent = d.mode;
  if (selectedCourt !== d.court && d.count > 0) {
    selectedCourt = d.court;
    renderCourtCards();
  }
});
socket.on('joined', (d) => {
  myTeam = d.team;
  document.getElementById('lobby').classList.add('hidden');
  unlockAudio();
});
socket.on('state', (s) => {
  lastState = nextState || s;
  nextState = s;
  stateRecvT = performance.now();
  serverState = s;
  if (s.court && s.court !== builtCourtKey) rebuildCourt(s.court);
  if (s.events) processEvents(s.events);
});

// interpolazione tra gli ultimi 2 snapshot (broadcast a 30Hz → render fluido)
function interp(now) {
  if (!lastState || !nextState) return nextState || lastState;
  const since = now - stateRecvT;
  const a = Math.max(0, Math.min(1, since / stateInterval));
  const lmap = new Map((lastState.players || []).map(p => [p.id, p]));
  const players = (nextState.players || []).map(np => {
    const lp = lmap.get(np.id) || np;
    return {
      ...np,
      x: lp.x + (np.x - lp.x) * a,
      z: lp.z + (np.z - lp.z) * a,
      stamina: lp.stamina + (np.stamina - lp.stamina) * a,
      swingT: lp.swingT + (np.swingT - lp.swingT) * a,
      chargeT: (lp.chargeT || 0) + ((np.chargeT || 0) - (lp.chargeT || 0)) * a,
    };
  });
  let ball = null;
  if (nextState.ball) {
    const nb = nextState.ball;
    const lb = lastState.ball || nb;
    ball = {
      ...nb,
      x: lb.x + (nb.x - lb.x) * a,
      y: lb.y + (nb.y - lb.y) * a,
      z: lb.z + (nb.z - lb.z) * a,
    };
  }
  return { ...nextState, players, ball };
}

// =========================================================================
// Lobby UI / scelta campo (thumbnail 2D indipendenti dal renderer 3D)
// =========================================================================
let selectedCourt = 'hard';
function renderCourtCards() {
  const root = document.getElementById('courts');
  root.innerHTML = '';
  for (const key of ['clay', 'grass', 'hard']) {
    const t = COURT_THEMES[key];
    const div = document.createElement('div');
    div.className = 'court-card' + (selectedCourt === key ? ' sel' : '');
    div.innerHTML = `
      <div class="court-thumb"><canvas width="200" height="125"></canvas></div>
      <div class="court-name">${t.name}</div>
      <div class="court-desc">${t.desc}</div>
    `;
    div.onclick = () => { selectedCourt = key; renderCourtCards(); socket.emit('setCourt', { court: key }); };
    root.appendChild(div);
    const tctx = div.querySelector('canvas').getContext('2d');
    drawCourtThumb(tctx, key, 200, 125);
  }
}
function drawCourtThumb(c, key, w, h) {
  const t = COURT_THEMES[key];
  c.fillStyle = t.apron; c.fillRect(0, 0, w, h);
  c.fillStyle = t.base;
  c.beginPath();
  c.moveTo(w * 0.05, h * 0.92); c.lineTo(w * 0.95, h * 0.92);
  c.lineTo(w * 0.78, h * 0.22); c.lineTo(w * 0.22, h * 0.22); c.closePath(); c.fill();
  c.strokeStyle = t.line; c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(w * 0.05, h * 0.92); c.lineTo(w * 0.95, h * 0.92);
  c.lineTo(w * 0.78, h * 0.22); c.lineTo(w * 0.22, h * 0.22); c.closePath();
  c.moveTo(w * 0.14, h * 0.57); c.lineTo(w * 0.86, h * 0.57);
  c.stroke();
}
renderCourtCards();

document.getElementById('enterBtn').onclick = () => {
  const name = (document.getElementById('nameIn').value || '').trim();
  unlockAudio();
  socket.emit('join', { name, court: selectedCourt });
};
document.getElementById('nameIn').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('enterBtn').click();
});

// =========================================================================
// Input: joystick + pulsanti colpo + servizio + emote
// =========================================================================
let joy = { x: 0, y: 0, active: false };
const nip = nipplejs.create({
  zone: document.getElementById('joy'),
  mode: 'static',
  position: { left: '50%', top: '50%' },
  color: '#ffd166',
  size: 150,
  threshold: 0.1,
  restOpacity: 0.55,
});
nip.on('move', (_, data) => {
  if (!data || !data.vector) return;
  joy.x = data.vector.x;
  joy.y = data.vector.y;
  joy.active = true;
});
nip.on('end', () => { joy.x = 0; joy.y = 0; joy.active = false; });

let lastInputSent = { mx: 0, mz: 0 };
setInterval(() => {
  const flip = (myTeam === 'B') ? -1 : 1;
  const mx = joy.x * flip;
  const mz = joy.y * flip;
  if (Math.abs(mx - lastInputSent.mx) > 0.04 || Math.abs(mz - lastInputSent.mz) > 0.04
      || (mx === 0 && mz === 0 && (lastInputSent.mx !== 0 || lastInputSent.mz !== 0))) {
    socket.emit('input', { mx, mz });
    lastInputSent = { mx, mz };
  }
}, 1000 / 30);

let charging = null; // {shot, startT}
let chargeTickTimer = null;
const shotEls = document.querySelectorAll('.sb');
const shotElByName = {};
shotEls.forEach((el) => { shotElByName[el.dataset.shot] = el; });

function endShotCharge(emit) {
  if (!charging) return;
  const cur = charging;
  charging = null;
  if (chargeTickTimer) { clearInterval(chargeTickTimer); chargeTickTimer = null; }
  const el = shotElByName[cur.shot];
  if (el) el.classList.remove('held');
  if (!emit) return;
  const charge = Math.min(1.5, (performance.now() - cur.startT) / 1000);
  const flip = (myTeam === 'B') ? -1 : 1;
  const angle = { x: joy.x * flip, y: joy.y * flip };
  const useSuper = serverState && serverState.energy && serverState.energy[myTeam] >= 1.0;
  socket.emit('shot', { shot: cur.shot, charge, angle, useSuper });
}
shotEls.forEach((el) => {
  const shot = el.dataset.shot;
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (charging) endShotCharge(false);
    charging = { shot, startT: performance.now() };
    el.classList.add('held');
    socket.emit('chargeStart', {});
    if (chargeTickTimer) clearInterval(chargeTickTimer);
    chargeTickTimer = setInterval(() => {
      if (!charging) return;
      const t = Math.min(1.5, (performance.now() - charging.startT) / 1000);
      socket.emit('chargeTick', { t });
    }, 100);
  });
});
window.addEventListener('pointerup', () => endShotCharge(true));
window.addEventListener('pointercancel', () => endShotCharge(true));

document.querySelectorAll('.emote').forEach((el) => {
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    socket.emit('emote', { key: el.dataset.key });
  });
});

// Servizio: tipo + carica
let serveType = 'flat';
let serveCharging = null;
let serveChargeTimer = null;
const serveGo = document.getElementById('serveGo');
const servePowerFill = document.getElementById('servePowerFill');
document.querySelectorAll('.serve-type').forEach((el) => {
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    document.querySelectorAll('.serve-type').forEach(t => t.classList.remove('sel'));
    el.classList.add('sel');
    serveType = el.dataset.serve;
  });
});
function resetServeCharge() {
  serveCharging = null;
  if (serveChargeTimer) { clearInterval(serveChargeTimer); serveChargeTimer = null; }
  serveGo.classList.remove('held');
  serveGo.textContent = 'TIENI PER CARICARE';
  servePowerFill.style.width = '0%';
}
function serveDown(e) {
  e.preventDefault();
  if (serveCharging) resetServeCharge();
  serveCharging = { startT: performance.now() };
  serveGo.classList.add('held');
  serveGo.textContent = 'RILASCIA PER SERVIRE';
  socket.emit('chargeStart', {});
  if (serveChargeTimer) clearInterval(serveChargeTimer);
  serveChargeTimer = setInterval(() => {
    if (!serveCharging) return;
    const t = Math.min(1.5, (performance.now() - serveCharging.startT) / 1000);
    servePowerFill.style.width = Math.min(100, (t / 1.5) * 100) + '%';
    socket.emit('chargeTick', { t });
  }, 40);
}
function serveUp(e) {
  if (!serveCharging) return;
  e && e.preventDefault();
  const charge = Math.min(1.5, (performance.now() - serveCharging.startT) / 1000);
  resetServeCharge();
  const flip = (myTeam === 'B') ? -1 : 1;
  const angle = { x: joy.x * flip, y: joy.y * flip };
  socket.emit('shot', { shot: 'serve', charge, angle, serveType });
}
serveGo.addEventListener('pointerdown', serveDown);
window.addEventListener('pointerup', serveUp);
window.addEventListener('pointercancel', serveUp);

let actx = null;
function unlockAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { /* niente audio */ }
}
window.addEventListener('pointerdown', unlockAudio, { once: true });
function sfxPock(power) {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(220 + power * 80, t);
  o.frequency.exponentialRampToValueAtTime(70, t + 0.07);
  g.gain.setValueAtTime(0.25 + power * 0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + 0.1);
  // crack di impatto
  const buf = actx.createBuffer(1, actx.sampleRate * 0.04, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const n = actx.createBufferSource(); n.buffer = buf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 0.8;
  const ng = actx.createGain(); ng.gain.value = 0.16 + power * 0.12;
  n.connect(bp).connect(ng).connect(actx.destination);
  n.start(t);
}
function sfxBounce() {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(60, t + 0.05);
  g.gain.setValueAtTime(0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + 0.07);
}
function sfxApplause(dur = 1.1) {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime;
  const buf = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) {
    const k = i / d.length;
    d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.22 ? 1 : 0.28) * (k < 0.12 ? k / 0.12 : 1 - (k - 0.12) / 0.88);
  }
  const n = actx.createBufferSource(); n.buffer = buf;
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 0.5;
  const g = actx.createGain(); g.gain.value = 0.20;
  n.connect(bp).connect(g).connect(actx.destination);
  n.start(t);
}

// =========================================================================
// Texture procedurali
// =========================================================================
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// Campo: 18m (x) × 30m (z) → canvas 1024×1707, linee bianche disegnate a misura reale
function makeCourtTexture(key) {
  const t = COURT_THEMES[key];
  const W = 1024, H = Math.round(W * 30 / 18);
  const c = makeCanvas(W, H);
  const g = c.getContext('2d');
  const px = W / 18; // pixel per metro
  const X = (m) => W / 2 + m * px;
  const Z = (m) => H / 2 + m * px;

  // fondo esterno (run-off)
  g.fillStyle = t.baseDark;
  g.fillRect(0, 0, W, H);
  // zona di gioco interna (rettangolo doppio + margine)
  g.fillStyle = t.base;
  g.fillRect(X(-COURT.DOUBLES_HALF_W), Z(-COURT.BASELINE_Z), (COURT.DOUBLES_HALF_W * 2) * px, (COURT.BASELINE_Z * 2) * px);

  // caratterizzazione superficie
  if (key === 'grass') {
    g.globalAlpha = 0.10;
    for (let i = 0; i < 20; i++) {
      if (i % 2) continue;
      g.fillStyle = '#ffffff';
      g.fillRect(0, (i / 20) * H, W, H / 20);
    }
    g.globalAlpha = 1;
  }
  // grana / usura
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.04)';
    g.fillRect(Math.random() * W, Math.random() * H, 1.6, 1.6);
  }
  if (key === 'clay') {
    // strisciate di terra
    g.strokeStyle = 'rgba(0,0,0,0.06)';
    for (let i = 0; i < 40; i++) {
      g.lineWidth = 2 + Math.random() * 5;
      g.beginPath();
      const x0 = Math.random() * W, y0 = Math.random() * H;
      g.moveTo(x0, y0);
      g.lineTo(x0 + (Math.random() - 0.5) * 130, y0 + (Math.random() - 0.5) * 60);
      g.stroke();
    }
  }

  // linee ufficiali
  g.strokeStyle = t.line;
  g.fillStyle = t.line;
  const lw = Math.max(2, 0.05 * px);
  g.lineWidth = lw;
  const dx = COURT.DOUBLES_HALF_W, sx = COURT.SINGLES_HALF_W, bz = COURT.BASELINE_Z, sz = COURT.SERVICE_Z;
  // perimetro doppio
  g.strokeRect(X(-dx), Z(-bz), dx * 2 * px, bz * 2 * px);
  // righe singolo
  g.beginPath();
  g.moveTo(X(-sx), Z(-bz)); g.lineTo(X(-sx), Z(bz));
  g.moveTo(X(sx), Z(-bz)); g.lineTo(X(sx), Z(bz));
  // righe servizio
  g.moveTo(X(-sx), Z(-sz)); g.lineTo(X(sx), Z(-sz));
  g.moveTo(X(-sx), Z(sz)); g.lineTo(X(sx), Z(sz));
  // riga centrale servizio
  g.moveTo(X(0), Z(-sz)); g.lineTo(X(0), Z(sz));
  g.stroke();
  // baseline più spesse + segno centrale
  g.lineWidth = lw * 1.8;
  g.beginPath();
  g.moveTo(X(-dx), Z(-bz)); g.lineTo(X(dx), Z(-bz));
  g.moveTo(X(-dx), Z(bz)); g.lineTo(X(dx), Z(bz));
  g.stroke();
  g.fillRect(X(0) - lw / 2, Z(-bz), lw, 0.18 * px);
  g.fillRect(X(0) - lw / 2, Z(bz) - 0.18 * px, lw, 0.18 * px);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return tex;
}

// Rete: trama a maglie + banda bianca superiore (alpha)
function makeNetTexture() {
  const c = makeCanvas(512, 96);
  const g = c.getContext('2d');
  g.clearRect(0, 0, 512, 96);
  g.strokeStyle = 'rgba(20,24,30,0.95)';
  g.lineWidth = 1.6;
  for (let x = 0; x <= 512; x += 7) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 96); g.stroke(); }
  for (let y = 0; y <= 96; y += 7) { g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke(); }
  g.fillStyle = 'rgba(245,247,250,0.98)';
  g.fillRect(0, 0, 512, 9);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.repeat.set(3, 1);
  return tex;
}

// Tabelloni pubblicitari
function makeBoardTexture(text) {
  const c = makeCanvas(1024, 88);
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 88);
  grad.addColorStop(0, '#101a30'); grad.addColorStop(1, '#0a1322');
  g.fillStyle = grad; g.fillRect(0, 0, 1024, 88);
  g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 3;
  g.strokeRect(2, 2, 1020, 84);
  g.fillStyle = 'rgba(255,255,255,0.78)';
  g.font = '900 44px -apple-system, Arial';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, 512, 47);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Folla sugli spalti: puntini colorati su gradinata scura
function makeCrowdTexture() {
  const c = makeCanvas(512, 128);
  const g = c.getContext('2d');
  g.fillStyle = '#0d1526'; g.fillRect(0, 0, 512, 128);
  const cols = ['#8b95a8', '#c0a080', '#7286a8', '#a87878', '#d8c8a8', '#6878a0', '#90b090'];
  for (let i = 0; i < 900; i++) {
    g.fillStyle = cols[(Math.random() * cols.length) | 0];
    g.globalAlpha = 0.35 + Math.random() * 0.5;
    const x = Math.random() * 512, y = Math.random() * 128;
    g.beginPath(); g.arc(x, y, 1.6 + Math.random() * 1.4, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  return tex;
}

// puntino tondo per Points (particelle e scie)
function makeDotTexture() {
  const c = makeCanvas(32, 32);
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(16, 16, 2, 16, 16, 15);
  rg.addColorStop(0, 'rgba(255,255,255,1)');
  rg.addColorStop(0.7, 'rgba(255,255,255,0.85)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(c);
}
const dotTex = makeDotTexture();

// Sprite alone luminoso (fari)
function makeGlowTexture() {
  const c = makeCanvas(128, 128);
  const g = c.getContext('2d');
  const rg = g.createRadialGradient(64, 64, 4, 64, 64, 64);
  rg.addColorStop(0, 'rgba(255,250,235,0.9)');
  rg.addColorStop(0.35, 'rgba(255,244,214,0.28)');
  rg.addColorStop(1, 'rgba(255,244,214,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

// Targhetta nome + barra stamina (billboard sopra la testa)
function makeNameSprite() {
  const c = makeCanvas(256, 72);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false });
  const spr = new THREE.Sprite(mat);
  spr.scale.set(1.5, 0.42, 1);
  spr.userData = { c, tex, key: '' };
  return spr;
}
function updateNameSprite(spr, name, color, isMe, stamina, emote) {
  const stQ = Math.round(stamina * 10) / 10;
  const key = `${name}|${color}|${isMe}|${stQ}|${emote || ''}`;
  if (spr.userData.key === key) return;
  spr.userData.key = key;
  const g = spr.userData.c.getContext('2d');
  g.clearRect(0, 0, 256, 72);
  if (emote) {
    g.fillStyle = 'rgba(255,255,255,0.96)';
    g.beginPath(); g.roundRect(48, 0, 160, 34, 12); g.fill();
    g.fillStyle = '#222';
    g.font = '900 22px -apple-system, Arial';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(emote, 128, 18);
  }
  g.font = '800 22px -apple-system, Arial';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = 'rgba(0,0,0,0.9)'; g.shadowBlur = 6;
  g.fillStyle = isMe ? '#ffd166' : '#ffffff';
  g.fillText(name || '·', 128, 46);
  g.shadowBlur = 0;
  // stamina
  g.fillStyle = 'rgba(0,0,0,0.6)';
  g.fillRect(78, 60, 100, 7);
  g.fillStyle = stamina > 0.6 ? '#06d6a0' : stamina > 0.3 ? '#ffd166' : '#ff5050';
  g.fillRect(79, 61, 98 * Math.max(0, Math.min(1, stamina)), 5);
  spr.userData.tex.needsUpdate = true;
}

let courtMesh = null, builtCourtKey = null, apronMesh = null;
function rebuildCourt(key) {
  builtCourtKey = key;
  const theme = COURT_THEMES[key] || COURT_THEMES.hard;
  if (courtMesh) {
    courtMesh.material.map.dispose();
    courtMesh.material.map = makeCourtTexture(key);
    courtMesh.material.needsUpdate = true;
  } else {
    courtMesh = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 30),
      new THREE.MeshStandardMaterial({ map: makeCourtTexture(key), roughness: 0.94, metalness: 0 })
    );
    courtMesh.rotation.x = -Math.PI / 2;
    courtMesh.receiveShadow = true;
    world.add(courtMesh);
  }
  if (apronMesh) apronMesh.material.color.set(theme.apron);
}

    }
  }
  for (const sx of [-1, 1]) {
    for (let i = 0; i < 4; i++) {
      const stand = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.5, 34), standMat);
      stand.position.set(sx * (14.5 + i * 2.3), 1.0 + i * 1.3, 0);
      world.add(stand);
    }
  }

  // fari agli angoli
  const glowTex = makeGlowTexture();
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x222a36, roughness: 0.6, metalness: 0.4 });
  const headMat = new THREE.MeshStandardMaterial({ color: 0xeef4ff, emissive: 0xffffff, emissiveIntensity: 1.6 });
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 13, 8), poleMat);
    pole.position.set(sx * 13.5, 6.5, sz * 18);
    world.add(pole);
    const head = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.85, 0.25), headMat);
    head.position.set(sx * 13.5, 12.6, sz * 18);
    head.lookAt(0, 0, 0);
    world.add(head);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.material.fog = false;
    glow.scale.set(7, 7, 1);
    glow.position.set(sx * 13.5, 12.7, sz * 18);
    world.add(glow);
  }
}

// Giocatori 3D: figura articolata low-poly
// =========================================================================
const SKIN = 0xd9a06e, HAIR = 0x2a1a10, SHORTS = 0x1d2330, SHOE = 0xf2f2f2;

function capsule(r, len, mat) {
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 3, 8), mat);
  m.castShadow = true;
  return m;
}

function buildPlayerMesh(shirtHex) {
  const shirtMat = new THREE.MeshStandardMaterial({ color: shirtHex, roughness: 0.75 });
  const skinMat = new THREE.MeshStandardMaterial({ color: SKIN, roughness: 0.7 });
  const shortMat = new THREE.MeshStandardMaterial({ color: SHORTS, roughness: 0.85 });
  const shoeMat = new THREE.MeshStandardMaterial({ color: SHOE, roughness: 0.55 });
  const hairMat = new THREE.MeshStandardMaterial({ color: HAIR, roughness: 0.9 });

  const root = new THREE.Group();
  const body = new THREE.Group(); // tutto ciò che si piega/abbassa
  root.add(body);

  // bacino + torso
  const pelvis = capsule(0.13, 0.10, shortMat); pelvis.position.y = 0.98; body.add(pelvis);
  const torso = capsule(0.155, 0.30, shirtMat); torso.position.y = 1.28; body.add(torso);
  // testa
  const headG = new THREE.Group(); headG.position.y = 1.625; body.add(headG);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.115, 14, 12), skinMat); head.castShadow = true; headG.add(head);
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.122, 14, 12, 0, Math.PI * 2, 0, Math.PI * 0.55), hairMat);
  hair.position.y = 0.018; headG.add(hair);

  // gambe: anca → ginocchio
  function makeLeg(sx) {
    const hip = new THREE.Group(); hip.position.set(sx * 0.10, 0.94, 0); body.add(hip);
    const thigh = capsule(0.062, 0.30, shortMat); thigh.position.y = -0.19; hip.add(thigh);
    const knee = new THREE.Group(); knee.position.y = -0.40; hip.add(knee);
    const shin = capsule(0.052, 0.30, skinMat); shin.position.y = -0.18; knee.add(shin);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.07, 0.23), shoeMat);
    foot.castShadow = true; foot.position.set(0, -0.40, 0.05); knee.add(foot);
    return { hip, knee };
  }
  const legL = makeLeg(-1), legR = makeLeg(1);

  // braccia: spalla → gomito; il braccio destro (racchetta) sta a x locale NEGATIVO
  // (figura orientata verso +z locale: la destra anatomica è -x)
  function makeArm(sx, withRacket) {
    const shoulder = new THREE.Group(); shoulder.position.set(sx * 0.215, 1.455, 0); body.add(shoulder);
    const upper = capsule(0.05, 0.20, shirtMat); upper.position.y = -0.15; shoulder.add(upper);
    const elbow = new THREE.Group(); elbow.position.y = -0.30; shoulder.add(elbow);
    const fore = capsule(0.043, 0.20, skinMat); fore.position.y = -0.14; elbow.add(fore);
    let racket = null;
    if (withRacket) {
      racket = new THREE.Group(); racket.position.y = -0.30; elbow.add(racket);
      const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.16, 8),
        new THREE.MeshStandardMaterial({ color: 0x15181e, roughness: 0.8 }));
      grip.position.y = -0.07; racket.add(grip);
      const frameMat = new THREE.MeshStandardMaterial({ color: 0xe8ecf2, roughness: 0.4, metalness: 0.3 });
      const hoop = new THREE.Mesh(new THREE.TorusGeometry(0.135, 0.014, 8, 22), frameMat);
      hoop.position.y = -0.30; racket.add(hoop);
      const strings = new THREE.Mesh(new THREE.CircleGeometry(0.125, 18),
        new THREE.MeshBasicMaterial({ color: 0xcfd8e8, transparent: true, opacity: 0.32, side: THREE.DoubleSide }));
      strings.position.y = -0.30; racket.add(strings);
    }
    return { shoulder, elbow, racket };
  }
  const armR = makeArm(-1, true);   // braccio racchetta
  const armL = makeArm(1, false);   // braccio libero

  // ombra morbida di contatto (oltre alla shadow map)
  const blob = new THREE.Mesh(new THREE.CircleGeometry(0.46, 22),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.36, depthWrite: false }));
  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.012; root.add(blob);

  const name = makeNameSprite();
  name.position.y = 2.12;
  root.add(name);

  return { root, body, headG, legL, legR, armR, armL, name, blob, shirtMat };
}

// =========================================================================
// Keyframe colpi (spalla destra a -x locale, figura verso +z locale)
// 3 fasi: [caricamento, contatto, follow-through]; el = piega gomito;
// body = rotazione Y del busto (coil → apertura)
// =========================================================================
const SHOT_KEYS = {
  drive: {
    // follow-through che chiude alto sopra la spalla OPPOSTA (rz cambia segno)
    fh: [{ rx: -0.50, ry: -1.05, rz: -1.05, el: 1.30 }, { rx: 0.45, ry: 0.15, rz: -1.15, el: 0.25 }, { rx: 1.35, ry: 1.15, rz: 0.55, el: 1.05 }],
    bh: [{ rx: -0.40, ry: 1.10, rz: 0.55, el: 1.60 }, { rx: 0.45, ry: -0.10, rz: 0.95, el: 0.35 }, { rx: 1.25, ry: -1.05, rz: -0.50, el: 0.75 }],
    body: [0.85, 0.10, -0.55],
  },
  slice: {
    fh: [{ rx: -0.95, ry: -0.75, rz: -0.95, el: 1.10 }, { rx: 0.40, ry: 0.10, rz: -1.05, el: 0.30 }, { rx: 0.95, ry: 0.65, rz: -0.55, el: 0.50 }],
    bh: [{ rx: -0.85, ry: 0.80, rz: 0.55, el: 1.30 }, { rx: 0.40, ry: -0.05, rz: 0.90, el: 0.35 }, { rx: 0.85, ry: -0.60, rz: 0.45, el: 0.50 }],
    body: [0.65, 0.10, -0.40],
  },
  lob: {
    fh: [{ rx: 0.15, ry: -0.60, rz: -0.75, el: 1.10 }, { rx: 0.70, ry: 0.05, rz: -0.90, el: 0.30 }, { rx: 2.05, ry: 0.70, rz: -0.35, el: 0.50 }],
    bh: [{ rx: 0.15, ry: 0.65, rz: 0.45, el: 1.20 }, { rx: 0.70, ry: 0.00, rz: 0.75, el: 0.35 }, { rx: 1.95, ry: -0.65, rz: 0.30, el: 0.50 }],
    body: [0.50, 0.10, -0.30],
  },
  drop: {
    fh: [{ rx: -0.35, ry: -0.45, rz: -0.85, el: 1.00 }, { rx: 0.30, ry: 0.05, rz: -0.95, el: 0.45 }, { rx: 0.55, ry: 0.35, rz: -0.75, el: 0.55 }],
    bh: [{ rx: -0.30, ry: 0.50, rz: 0.50, el: 1.10 }, { rx: 0.30, ry: 0.00, rz: 0.80, el: 0.50 }, { rx: 0.50, ry: -0.35, rz: 0.60, el: 0.55 }],
    body: [0.40, 0.05, -0.20],
  },
  volley: {
    fh: [{ rx: -0.15, ry: -0.35, rz: -0.95, el: 0.85 }, { rx: 0.50, ry: 0.10, rz: -1.00, el: 0.35 }, { rx: 0.70, ry: 0.30, rz: -0.85, el: 0.45 }],
    bh: [{ rx: -0.15, ry: 0.40, rz: 0.55, el: 0.95 }, { rx: 0.50, ry: -0.05, rz: 0.85, el: 0.40 }, { rx: 0.65, ry: -0.30, rz: 0.65, el: 0.45 }],
    body: [0.30, 0.05, -0.15],
  },
  smash: {
    fh: [{ rx: -2.40, ry: 0.15, rz: -0.35, el: 1.80 }, { rx: -3.05, ry: 0.05, rz: -0.12, el: 0.10 }, { rx: -4.30, ry: -0.10, rz: 0.10, el: 0.55 }],
    bh: [{ rx: -2.40, ry: 0.15, rz: -0.35, el: 1.80 }, { rx: -3.05, ry: 0.05, rz: -0.12, el: 0.10 }, { rx: -4.30, ry: -0.10, rz: 0.10, el: 0.55 }],
    body: [0.35, 0.05, -0.25],
  },
  serve: {
    fh: [{ rx: -2.30, ry: 0.20, rz: -0.40, el: 1.90 }, { rx: -3.10, ry: 0.05, rz: -0.10, el: 0.05 }, { rx: -4.45, ry: -0.15, rz: 0.15, el: 0.60 }],
    bh: [{ rx: -2.30, ry: 0.20, rz: -0.40, el: 1.90 }, { rx: -3.10, ry: 0.05, rz: -0.10, el: 0.05 }, { rx: -4.45, ry: -0.15, rz: 0.15, el: 0.60 }],
    body: [0.30, 0.00, -0.20],
  },
};
const IDLE_ARM = { rx: 0.10, ry: 0, rz: -0.22, el: 0.55 };

function lerp(a, b, t) { return a + (b - a) * t; }
function lerpKey(k0, k1, t) {
  return { rx: lerp(k0.rx, k1.rx, t), ry: lerp(k0.ry, k1.ry, t), rz: lerp(k0.rz, k1.rz, t), el: lerp(k0.el, k1.el, t) };
}
// fase q (0..1) → key interpolata: 0→0.3 caricamento→contatto (accelera), 0.3→1 follow (decelera)
function sampleShotKeys(keys, q) {
  if (q < 0.30) {
    const t = q / 0.30;
    return lerpKey(keys[0], keys[1], t * t);
  }
  const t = (q - 0.30) / 0.70;
  return lerpKey(keys[1], keys[2], 1 - (1 - t) * (1 - t));
}
function sampleBody(arr, q) {
  if (q < 0.30) { const t = q / 0.30; return lerp(arr[0], arr[1], t * t); }
  const t = (q - 0.30) / 0.70;
  return lerp(arr[1], arr[2], 1 - (1 - t) * (1 - t));
}

function getAnim(id) {
  let a = animStates[id];
  if (!a) {
    a = animStates[id] = {
      run: Math.random() * 6, breath: Math.random() * 6, swing: 0, speedN: 0,
      splitT: 0, celeT: 0, dejT: 0,
      shot: 'drive', sideX: 1,
      turn: 0, // rotazione fluida del busto
    };
  }
  return a;
}

function getPlayerMesh(p) {

}

// =========================================================================
// Aggiorna il giocatore 3D dalla pose state-machine
// =========================================================================
function updatePlayer3D(p, dt) {
  const m = getPlayerMesh(p);
  const a = getAnim(p.id);
  const ball = interpState && interpState.ball;

  // timer pose
  a.splitT = Math.max(0, a.splitT - dt);
  a.celeT = Math.max(0, a.celeT - dt);
  a.dejT = Math.max(0, a.dejT - dt);

  const speed = Math.hypot(p.vx || 0, p.vz || 0);
  const speedN = Math.min(1, speed / 5.0);
  a.speedN += (speedN - a.speedN) * Math.min(1, dt * 10);
  a.run += dt * (2.2 + a.speedN * 9.5);
  a.breath += dt * 1.8;
  a.swing += ((p.swingT || 0) - a.swing) * Math.min(1, dt * 16);

  const isServing = serverState && serverState.phase === 'serving' && serverState.serverId === p.id;
  const chargeN = p.charging ? Math.min(1, (p.chargeT || 0) / 1.5) : 0;

  // hop (split-step / esultanza) e slump (delusione)
  let hopY = 0;
  if (a.splitT > 0) hopY = Math.sin(Math.PI * (1 - a.splitT / 0.26)) * 0.10;
  if (a.celeT > 0) hopY = Math.abs(Math.sin((1.4 - a.celeT) * 9)) * 0.15;
  const slump = a.dejT > 0 ? Math.min(1, (1.4 - a.dejT) * 4) : 0;
  const crouch = a.speedN * 0.05 + chargeN * 0.10 + slump * 0.12;

  // root: posizione + orientamento base verso la rete
  m.root.position.set(p.x, hopY, p.z);
  const faceY = p.team === 'A' ? 0 : Math.PI;
  // busto abbassato dal crouch (le gambe si piegano)
  m.body.position.y = -crouch;
  m.body.rotation.x = a.speedN * 0.14 + slump * 0.30; // inclinazione in corsa / spalle giù

  // lato del colpo: in locale, la racchetta è a -x. fh ⇔ palla sul lato racchetta.
  const teamSign = p.team === 'A' ? 1 : -1;
  let dxLocal = (a.sideX || 1) * teamSign * -1; // <0 = lato racchetta
  if ((p.charging || a.swing <= 0.01) && ball) {
    const dxw = ball.x - p.x;
    if (Math.abs(dxw) > 0.25) dxLocal = (dxw * teamSign >= 0 ? 1 : -1) * -1;
  }
  const isFH = dxLocal < 0;
  const sideKey = isFH ? 'fh' : 'bh';
  // coil del busto: nel dritto le spalle ruotano verso il lato racchetta (-x locale),
  // nel rovescio verso +x
  const coilSign = isFH ? -1 : 1;

  const shotForPose = (p.id === myId && charging) ? charging.shot : (a.shot || 'drive');
  const env = Math.max(0, Math.min(1, a.swing));
  const q = 1 - env;

  // ---- scelta posa braccio racchetta + busto ----
  let armKey, bodyRot = 0, freeKey = null;
  const def = SHOT_KEYS[shotForPose] || SHOT_KEYS.drive;
  const cur = SHOT_KEYS[a.shot] || SHOT_KEYS.drive;

  if (a.celeT > 0) {
    const w = Math.sin(performance.now() / 90) * 0.15;
    armKey = { rx: -2.9 + w, ry: 0, rz: -0.25, el: 0.25 };
    freeKey = { rx: -2.9 - w, ry: 0, rz: 0.25, el: 0.25 };
  } else if (a.dejT > 0) {
    armKey = { rx: 0.25, ry: 0, rz: -0.12, el: 0.15 };
    freeKey = { rx: 0.25, ry: 0, rz: 0.12, el: 0.15 };
  } else if (isServing && p.charging) {
    // caricamento del servizio: racchetta dietro la testa, braccio libero al toss
    armKey = lerpKey(IDLE_ARM, SHOT_KEYS.serve.fh[0], Math.min(1, chargeN * 2.5));
    freeKey = { rx: -2.6 * Math.min(1, chargeN * 2.2), ry: 0, rz: 0.30, el: 0.15 };
    bodyRot = SHOT_KEYS.serve.body[0] * Math.min(1, chargeN * 2.5) * coilSign;
  } else if (p.charging && chargeN > 0.02) {
    // windup del colpo scelto
    armKey = lerpKey(IDLE_ARM, def[sideKey][0], Math.min(1, chargeN * 2.4));
    bodyRot = def.body[0] * Math.min(1, chargeN * 2.4) * coilSign;
  } else if (env > 0.01) {
    // swing in corso (contatto → follow-through)
    armKey = sampleShotKeys(cur[sideKey], q);
    bodyRot = sampleBody(cur.body, q) * coilSign;
  } else {
    // idle / corsa: braccia coordinate con le gambe
    const sw = Math.sin(a.run) * 0.5 * a.speedN;
    armKey = { rx: IDLE_ARM.rx + sw, ry: 0, rz: IDLE_ARM.rz, el: IDLE_ARM.el + a.speedN * 0.45 };
    freeKey = { rx: IDLE_ARM.rx - sw, ry: 0, rz: -IDLE_ARM.rz, el: IDLE_ARM.el + a.speedN * 0.45 };
  }

  // orientamento fluido: base verso la rete + coil del colpo + sguardo alla palla
  let lookTurn = 0;
  if (ball && a.celeT <= 0 && a.dejT <= 0) {
    const lx = (ball.x - p.x) * teamSign;
    const lz = (ball.z - p.z) * teamSign;
    lookTurn = Math.max(-0.5, Math.min(0.5, Math.atan2(lx, Math.max(0.8, lz)) * 0.55));
  }
  const targetTurn = bodyRot + lookTurn;
  a.turn += (targetTurn - a.turn) * Math.min(1, dt * 10);
  m.root.rotation.y = faceY + a.turn;

  // ---- braccio racchetta ----
  m.armR.shoulder.rotation.set(armKey.rx, armKey.ry, armKey.rz, 'ZYX');
  m.armR.elbow.rotation.x = -armKey.el;
  // ---- braccio libero ----
  if (!freeKey) freeKey = { rx: 0.15 - (armKey.rx * 0.18), ry: 0, rz: 0.30, el: 0.45 };
  m.armL.shoulder.rotation.set(freeKey.rx, freeKey.ry, -Math.abs(freeKey.rz), 'ZYX');
  m.armL.elbow.rotation.x = -freeKey.el;

  // ---- gambe: ciclo corsa o stance ----
  const stride = (0.55 + 0.25 * a.speedN);
  if (a.splitT > 0) {
    m.legL.hip.rotation.x = 0; m.legR.hip.rotation.x = 0;
    m.legL.hip.rotation.z = 0.30; m.legR.hip.rotation.z = -0.30;
    m.legL.knee.rotation.x = 0.5; m.legR.knee.rotation.x = 0.5;
  } else if (a.speedN > 0.04) {
    const phL = Math.sin(a.run), phR = Math.sin(a.run + Math.PI);
    m.legL.hip.rotation.set(phL * stride, 0, 0.02);
    m.legR.hip.rotation.set(phR * stride, 0, -0.02);
    m.legL.knee.rotation.x = Math.max(0, -phL) * 1.1 * (0.4 + a.speedN);
    m.legR.knee.rotation.x = Math.max(0, -phR) * 1.1 * (0.4 + a.speedN);
  } else {
    const sway = Math.sin(a.breath) * 0.02;
    m.legL.hip.rotation.set(sway + crouch * 0.7, 0, 0.03);
    m.legR.hip.rotation.set(-sway + crouch * 0.7, 0, -0.03);
    m.legL.knee.rotation.x = crouch * 1.6 + 0.04;
    m.legR.knee.rotation.x = crouch * 1.6 + 0.04;
  }

  // testa: guarda la palla
  if (ball) {
    const lx = (ball.x - p.x) * teamSign;
    const ly = ball.y - 1.6;
    const lz = Math.max(0.6, (ball.z - p.z) * teamSign);
    m.headG.rotation.y = Math.max(-0.7, Math.min(0.7, Math.atan2(lx, lz)));
    m.headG.rotation.x = Math.max(-0.5, Math.min(0.4, -Math.atan2(ly, Math.hypot(lx, lz)) * 0.6 + slump * 0.5));
  } else {
    m.headG.rotation.set(slump * 0.5, 0, 0);
  }

  // targhetta nome + emote
  const emoteTxt = p.emote ? ({ mine: 'Mia!', nice: 'Grande!', no: 'Nooo!', go: 'Dai!' }[p.emote.key] || '!') : '';
  updateNameSprite(m.name, p.name, p.color, p.id === myId, p.stamina || 0, emoteTxt);

  // anello carica
  const ring = getChargeRing(p.id);
  if (p.charging && chargeN > 0.01) {
    ring.visible = true;
    ring.position.set(p.x, 0.025, p.z);
    const s = 1 + chargeN * 0.65;
    ring.scale.set(s, s, 1);
    ring.material.color.setHSL(0.12 - chargeN * 0.12, 0.95, 0.6);
    ring.material.opacity = 0.45 + chargeN * 0.45;
  } else ring.visible = false;

  // scia di scivolata sulla terra
  if ((p.slide || 0) > 0.3 && serverState && serverState.court === 'clay' && Math.random() < 0.35) {
    spawnBurst(p.x, 0.06, p.z, COURT_THEMES.clay.particle, 2, 1.2);
  }
}

const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(0.075, 18, 14),

// scia: Points con dissolvenza
const TRAIL_N = 22;
const trailGeo = new THREE.BufferGeometry();

const trailCol = new Float32Array(TRAIL_N * 3);
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
trailGeo.setAttribute('color', new THREE.BufferAttribute(trailCol, 3));
const trailPts = new THREE.Points(trailGeo, new THREE.PointsMaterial({

const trailHist = [];
let trailLastT = 0;

function updateBall3D(b, now) {
  if (!b) { ballMesh.visible = false; ballBlob.visible = false; trailHist.length = 0; updateTrail('#fff'); return; }
  ballMesh.visible = true;
  ballMesh.position.set(b.x, Math.max(0.05, b.y), b.z);
  ballSquash = Math.max(0, ballSquash - 0.06);
  ballMesh.scale.set(1 + ballSquash * 0.4, 1 - ballSquash * 0.5, 1 + ballSquash * 0.4);
  ballBlob.visible = true;
  ballBlob.position.set(b.x, 0.014, b.z);
  const hN = Math.min(1, b.y / 6);
  ballBlob.material.opacity = 0.42 * (1 - hN * 0.7);
  const bs = 1 + hN * 1.6;
  ballBlob.scale.set(bs, bs, 1);

  if (now - trailLastT > 16 && !b.held) {
    trailHist.push({ x: b.x, y: b.y, z: b.z });
    if (trailHist.length > TRAIL_N) trailHist.shift();
    trailLastT = now;
  }
  updateTrail(SHOT_COLORS[b.type] || '#ffffff', b.isSuper);
}
const _tmpColor = new THREE.Color();
function updateTrail(hex, rainbow) {
  for (let i = 0; i < TRAIL_N; i++) {
    const h = trailHist[i];
    const k = trailHist.length > 1 ? i / (trailHist.length - 1) : 0;
    if (h) {
      trailPos[i * 3] = h.x; trailPos[i * 3 + 1] = h.y; trailPos[i * 3 + 2] = h.z;
      if (rainbow) _tmpColor.setHSL((k * 2 + performance.now() / 800) % 1, 0.95, 0.55);
      else _tmpColor.set(hex);
      const f = k * k * 0.9;
      trailCol[i * 3] = _tmpColor.r * f; trailCol[i * 3 + 1] = _tmpColor.g * f; trailCol[i * 3 + 2] = _tmpColor.b * f;
    } else {
      trailPos[i * 3 + 1] = -10;
      trailCol[i * 3] = trailCol[i * 3 + 1] = trailCol[i * 3 + 2] = 0;
    }
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.color.needsUpdate = true;
}

// Traiettoria prevista (stessa fisica del server) + anello atterraggio

const PRED_N = 22;
const predDots = [];
for (let i = 0; i < PRED_N; i++) {
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5, depthWrite: false }));
  d.visible = false; predDots.push(d); world.add(d);
}
const landRing = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.21, 28),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false }));
landRing.rotation.x = -Math.PI / 2; landRing.position.y = 0.02; landRing.visible = false;
world.add(landRing);

function updatePredictedPath(b) {
  let used = 0;
  let land = null;
  if (b && !b.held && Math.hypot(b.vx || 0, b.vy || 0, b.vz || 0) > 1.5) {
    let x = b.x, y = b.y, z = b.z, vx = b.vx, vy = b.vy, vz = b.vz;
    let spin = b.spin || 0, curve = b.curve || 0;
    const dt = 1 / 60;
    const col = SHOT_COLORS[b.type] || '#ffffff';
    for (let i = 0; i < 160 && used < PRED_N; i++) {
      const v = Math.hypot(vx, vy, vz);
      vx -= vx * 0.024 * v * dt; vy -= vy * 0.024 * v * dt; vz -= vz * 0.024 * v * dt;
      vy -= 9.8 * dt; vy -= spin * 8.0 * dt;
      if (curve) { vx += curve * 5.0 * dt; curve *= (1 - dt * 0.5); }
      const zPrev = z;
      x += vx * dt; y += vy * dt; z += vz * dt;
      if (zPrev * z < 0 && y < COURT.NET_H_CENTER && Math.abs(x) < COURT.DOUBLES_HALF_W + 0.9) break;
      if (y <= 0.034) { land = { x, z, col }; break; }
      if (i % 7 === 6) {
        const d = predDots[used++];
        d.visible = true;
        d.position.set(x, y, z);
        d.material.color.set(col);
        d.material.opacity = 0.16 + 0.30 * (used / PRED_N);
      }
    }
  }
  for (let i = used; i < PRED_N; i++) predDots[i].visible = false;
  if (land) {
    landRing.visible = true;
    landRing.position.set(land.x, 0.02, land.z);
    landRing.material.color.set(land.col);
    const k = 1 + 0.18 * Math.sin(performance.now() / 150);
    landRing.scale.set(k, k, 1);
  } else landRing.visible = false;
}

function makeAimArrow(colorHex) {
  const g = new THREE.Group();
  const mat = new THREE.LineDashedMaterial({ color: colorHex, dashSize: 0.45, gapSize: 0.3, transparent: true, opacity: 0.85 });
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, 0, 1)]);
  const line = new THREE.Line(geo, mat);
  g.add(line);
  const head = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.45, 10), new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.9 }));
  g.add(head);
  g.visible = false;
  g.userData = { line, head };
  world.add(g);
  return g;
}
const serveAim = makeAimArrow(0xffd166);
const shotAim = makeAimArrow(0x74c0fc);
function pointAim(arrow, x0, z0, x1, z1) {
  arrow.visible = true;
  const { line, head } = arrow.userData;
  line.geometry.setFromPoints([new THREE.Vector3(x0, 0.07, z0), new THREE.Vector3(x1, 0.07, z1)]);
  line.geometry.attributes.position.needsUpdate = true;
  line.computeLineDistances();
  head.position.set(x1, 0.07, z1);
  head.rotation.set(Math.PI / 2, 0, Math.atan2(x1 - x0, z1 - z0) > 0 ? 0 : 0);
  head.lookAt(x1 + (x1 - x0) * 0.01, 0.07, z1 + (z1 - z0) * 0.01);
  head.rotateX(Math.PI / 2);
}

// Particelle 3D (rimbalzi, polvere) + anelli d'impatto

const PART_N = 140;
const partGeo = new THREE.BufferGeometry();
const partPos = new Float32Array(PART_N * 3);
const partCol = new Float32Array(PART_N * 3);
partGeo.setAttribute('position', new THREE.BufferAttribute(partPos, 3));
partGeo.setAttribute('color', new THREE.BufferAttribute(partCol, 3));
const partPts = new THREE.Points(partGeo, new THREE.PointsMaterial({
  size: 0.075, vertexColors: true, transparent: true, opacity: 0.95, map: dotTex,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
}));
partPts.frustumCulled = false;
world.add(partPts);
const partData = [];
for (let i = 0; i < PART_N; i++) partData.push({ life: 0, max: 1, x: 0, y: -10, z: 0, vx: 0, vy: 0, vz: 0 });
let partCursor = 0;

function spawnBurst(x, y, z, colors, n, vel) {
  for (let i = 0; i < n; i++) {
    const p = partData[partCursor];
    partCursor = (partCursor + 1) % PART_N;
    const ang = Math.random() * Math.PI * 2;
    const sp = (0.6 + Math.random() * 1.4) * (vel || 1.5);
    p.x = x; p.y = y; p.z = z;
    p.vx = Math.cos(ang) * sp; p.vz = Math.sin(ang) * sp;
    p.vy = 0.8 + Math.random() * 2.2;
    p.life = p.max = 0.45 + Math.random() * 0.35;
    _tmpColor.set(colors[(Math.random() * colors.length) | 0]);
    p.cr = _tmpColor.r; p.cg = _tmpColor.g; p.cb = _tmpColor.b;
  }
}
function stepParticles(dt) {
  for (let i = 0; i < PART_N; i++) {
    const p = partData[i];
    if (p.life <= 0) { partPos[i * 3 + 1] = -10; continue; }
    p.life -= dt;
    p.vy -= 9 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    if (p.y < 0.02) { p.y = 0.02; p.vy *= -0.35; p.vx *= 0.8; p.vz *= 0.8; }
    const f = Math.max(0, p.life / p.max);
    partPos[i * 3] = p.x; partPos[i * 3 + 1] = p.y; partPos[i * 3 + 2] = p.z;
    partCol[i * 3] = (p.cr || 1) * f; partCol[i * 3 + 1] = (p.cg || 1) * f; partCol[i * 3 + 2] = (p.cb || 1) * f;
  }
  partGeo.attributes.position.needsUpdate = true;
  partGeo.attributes.color.needsUpdate = true;
}

// anelli d'impatto al contatto racchetta-palla
const popRings = [];
for (let i = 0; i < 5; i++) {
  const r = new THREE.Mesh(new THREE.RingGeometry(0.30, 0.36, 32),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }));
  r.visible = false;
  r.userData = { t: 1 };
  popRings.push(r); world.add(r);
}
function spawnPop(x, y, z, colorHex) {
  const r = popRings.find(rr => rr.userData.t >= 1) || popRings[0];
  r.userData.t = 0;
  r.visible = true;
  r.position.set(x, y, z);
  r.material.color.set(colorHex || '#ffffff');
}
function stepPops(dt) {
  for (const r of popRings) {
    if (r.userData.t >= 1) { r.visible = false; continue; }
    r.userData.t = Math.min(1, r.userData.t + dt / 0.4);
    const k = r.userData.t;
    const s = 0.5 + k * 3.2;
    r.scale.set(s, s, s);
    r.material.opacity = (1 - k) * 0.85;
    r.lookAt(camera.position);
  }
}

let shakeT = 0, shakeAmp = 0;
const toastEl = document.getElementById('toast');

function toast(text, klass = '', dur = 900) {

// =========================================================================
// Eventi dal server → effetti
// =========================================================================
function processEvents(events) {
  for (const ev of events) {
    if (ev.type === 'hit') {
      const an = getAnim(ev.id);
      an.shot = ev.shot || 'drive';
      an.sideX = ev.sideX || 1;
      const p = (serverState.players || []).find(pp => pp.id === ev.id);
      const hitterTeam = ev.team || (p && p.team);
      if (hitterTeam) {
        for (const q of serverState.players || []) {
          if (q.team !== hitterTeam) getAnim(q.id).splitT = 0.26;
        }
      }
      shake(0.25 + (ev.charge || 0) * 0.8 + (ev.super ? 1.2 : 0));
      flash(0.05 + (ev.charge || 0) * 0.10 + (ev.timing === 'perfect' ? 0.12 : 0), 90);
      spawnPop(ev.x, 1.15, ev.z, ev.super ? '#ff006e' : ev.timing === 'perfect' ? '#06d6a0' : '#ffffff');
      spawnBurst(ev.x, 1.1, ev.z, [SHOT_COLORS[ev.shot] || '#fff'], 7, 1.8);
      sfxPock(Math.min(1, (ev.charge || 0) + (ev.super ? 0.5 : 0)));
      if (ev.shot === 'smash') shake(1.6, 0.45);
      if (ev.super) { shake(2.0, 0.55); flash(0.4); }
    } else if (ev.type === 'perfect') {
      toast('PERFECT!', 'gold', 800);
      spawnBurst(ev.x, 1.4, ev.z, ['#ffd166', '#fff3bf'], 14, 2.6);
    } else if (ev.type === 'bounce') {
      const theme = COURT_THEMES[ev.court] || COURT_THEMES.hard;
      spawnBurst(ev.x, 0.04, ev.z, theme.particle, ev.court === 'clay' ? 12 : 7, 1.6);
      addClayMark(ev.x, ev.z);
      ballSquash = 1;
      sfxBounce();
    } else if (ev.type === 'out') {
      toast('OUT!', 'red', 900);
      flash(0.3); vignette('rgba(255,50,50,0.55)', 400);
    } else if (ev.type === 'net') {
      toast('NET!', '', 700);
      spawnBurst(ev.x, ev.y || 0.8, 0, ['#cfd6e1'], 6, 1.2);
    } else if (ev.type === 'fault') {
      toast(ev.n === 1 ? 'FAULT' : 'DOUBLE FAULT!', ev.n === 1 ? 'orange' : 'red', 900);
    } else if (ev.type === 'pointWon') {
      flash(0.35, 220);
      shake(1.2, 0.4);
      sfxApplause();
      for (const q of serverState.players || []) {
        const an = getAnim(q.id);
        if (q.team === ev.team) { an.celeT = 1.4; an.dejT = 0; }
        else { an.dejT = 1.4; an.celeT = 0; }
      }
    } else if (ev.type === 'miss') {
      if (ev.id === myId) toast('A VUOTO!', 'orange', 500);
    } else if (ev.type === 'game') {
      toast('GAME', 'blue', 1100);
    } else if (ev.type === 'set') {
      toast('SET ' + ev.team, 'gold', 1500);
      sfxApplause(1.6);
    } else if (ev.type === 'match') {
      toast(`MATCH ${ev.team === myTeam ? 'WIN' : 'LOSS'}!`, ev.team === myTeam ? 'gold' : 'red', 3000);
      sfxApplause(2.2);
    } else if (ev.type === 'deuce') {
      toast('DEUCE', '', 900);
    } else if (ev.type === 'advantage') {
      toast('VANTAGGIO ' + ev.team, 'gold', 900);
    } else if (ev.type === 'tiebreak') {
      toast('TIE-BREAK', 'orange', 1500);
    } else if (ev.type === 'doubleFault') {
      toast('DOPPIO FALLO', 'red', 1100);
    } else if (ev.type === 'serveHit') {
      // niente toast
    }
  }
}

function pointLabel(n) { return ['0', '15', '30', '40'][Math.min(3, n)]; }
function teamLabel(team) {
  const list = (serverState.players || []).filter(pp => pp.team === team);
  if (!list.length) return team;
  const base = (list[0].name || team).slice(0, 9).toUpperCase();
  return list.length > 1 ? `${base} +${list.length - 1}` : base;
}
let scorePopT = -1e9, lastScoreKey = '', lastHudHtml = '';
function renderHud() {
  const hud = document.getElementById('hud');
  if (!serverState) { if (lastHudHtml) { hud.innerHTML = ''; lastHudHtml = ''; } return; }
  const s = serverState.score;
  let aLabel, bLabel;
  if (s.labels) { aLabel = s.labels.A; bLabel = s.labels.B; }
  else { aLabel = pointLabel(s.points.A); bLabel = pointLabel(s.points.B); }

  const key = `${aLabel}|${bLabel}|${s.games.A}|${s.games.B}|${(s.sets || []).length}`;
  if (key !== lastScoreKey) {
    if (lastScoreKey) scorePopT = performance.now();
    lastScoreKey = key;
  }
  const pop = Math.max(0, 1 - (performance.now() - scorePopT) / 450);
  const popScale = 1 + pop * pop * 0.16;

  const sv = (serverState.players || []).find(pp => pp.id === serverState.serverId);
  const servingTeam = sv ? sv.team : null;
  const dotA = servingTeam === 'A' ? '<span class="serve-dot">●</span>' : '';
  const dotB = servingTeam === 'B' ? '<span class="serve-dot">●</span>' : '';

  const sets = s.sets || [{ A: 0, B: 0 }];
  let setHeaders = '<div class="head">·</div><div class="head">SET</div>';
  let aRow = `<div class="tn A">${dotA}${teamLabel('A')}</div><div class="cell sets">${(s.setsWon && s.setsWon.A) || 0}</div>`;
  let bRow = `<div class="tn B">${dotB}${teamLabel('B')}</div><div class="cell sets">${(s.setsWon && s.setsWon.B) || 0}</div>`;
  for (let i = 0; i < Math.max(1, sets.length); i++) {
    const isCur = i === sets.length - 1;
    setHeaders += `<div class="head">S${i + 1}</div>`;
    const sa = sets[i] ? (isCur ? s.games.A : sets[i].A) : 0;
    const sb = sets[i] ? (isCur ? s.games.B : sets[i].B) : 0;
    aRow += `<div class="cell ${isCur ? 'cur' : ''}">${sa}</div>`;
    bRow += `<div class="cell ${isCur ? 'cur' : ''}">${sb}</div>`;
  }
  setHeaders += `<div class="head">${s.tiebreak ? 'TB' : 'PT'}</div>`;
  aRow += `<div class="cell cur pts"><b>${aLabel}</b></div>`;
  bRow += `<div class="cell cur pts"><b>${bLabel}</b></div>`;

  const mode = serverState.mode || '1v1';
  const courtName = (COURT_THEMES[serverState.court] || {}).name || '';
  const kmh = s.lastServeKmh ? `· ${s.lastServeKmh} km/h` : '';
  const nCols = 2 + Math.max(1, sets.length);

  const html = `
    <div class="scoreboard" style="grid-template-columns: auto repeat(${nCols}, minmax(28px, auto)); transform: scale(${popScale.toFixed(3)});">
      <div class="row">${setHeaders}</div>
      <div class="row">${aRow}</div>
      <div class="row">${bRow}</div>
    </div>
    <div class="meta">${mode} · ${courtName} ${kmh}</div>
  `;
  if (html !== lastHudHtml) { hud.innerHTML = html; lastHudHtml = html; }

  // energia (DOM)
  const myE = (serverState.energy && serverState.energy[myTeam]) || 0;
  const opE = (serverState.energy && serverState.energy[myTeam === 'A' ? 'B' : 'A']) || 0;
  const em = document.getElementById('energyMine'), eo = document.getElementById('energyOpp');
  em.querySelector('.efill').style.width = (myE * 100) + '%';
  eo.querySelector('.efill').style.width = (opE * 100) + '%';
  em.classList.toggle('full', myE >= 1);
  eo.classList.toggle('full', opE >= 1);
  eo.querySelector('.efill').style.background = TEAM_COLOR[myTeam === 'A' ? 'B' : 'A'].main;
  if (myE < 1) em.querySelector('.efill').style.background = TEAM_COLOR[myTeam].main;

  const shotsEl = document.getElementById('shots');
  shotsEl.classList.toggle('super-ready', myE >= 1.0);

  const iAmServing = serverState.phase === 'serving' && serverState.serverId === myId;
  document.getElementById('servePanel').classList.toggle('show', iAmServing);
  shotsEl.classList.toggle('hidden', iAmServing);
  if (!iAmServing && serveCharging) resetServeCharge();
  if (serverState.phase !== 'rally' && charging) endShotCharge(false);
}

// =========================================================================
// Camera: TV-style dietro la mia metà campo, segue dolcemente palla e giocatore
// =========================================================================
function updateCamera(s, dt) {
  // hook per screenshot/debug: window.dbgCam = {x,y,z,lx,ly,lz}
  if (window.dbgCam) {
    const d = window.dbgCam;
    camera.position.set(d.x, d.y, d.z);
    camera.lookAt(d.lx || 0, d.ly || 1, d.lz || 0);
    return;
  }
  const side = myTeam === 'B' ? -1 : 1; // la mia baseline: z negativo per A
  const ball = s && s.ball;
  const me = s && (s.players || []).find(p => p.id === myId);
  let tx = 0;
  if (ball && me) tx = ball.x * 0.30 + me.x * 0.22;
  else if (me) tx = me.x * 0.35;
  tx = Math.max(-3.4, Math.min(3.4, tx)) * side;

  const targetPos = new THREE.Vector3(tx, 6.7, -side * (COURT.BASELINE_Z + 7.9));
  const targetLook = new THREE.Vector3(tx * 0.45, 0.25, side * 4.2);
  const k = Math.min(1, dt * 4.5);
  camPos.lerp(targetPos, k);
  camLook.lerp(targetLook, k);

  // screen shake
  let ox = 0, oy = 0;
  if (shakeT > 0) {
    ox = (Math.random() - 0.5) * shakeAmp * 0.16;
    oy = (Math.random() - 0.5) * shakeAmp * 0.16;
    shakeT -= dt;
    shakeAmp *= 0.92;
    if (shakeT <= 0) { shakeT = 0; shakeAmp = 0; }
  }
  camera.position.set(camPos.x + ox, camPos.y + oy, camPos.z);
  camera.lookAt(camLook.x, camLook.y, camLook.z);
}

// =========================================================================
// MAIN LOOP
// =========================================================================
let lastFrameT = performance.now();
let interpState = null;

function frame(now) {
  let dt = (now - lastFrameT) / 1000;
  lastFrameT = now;
  if (dt > 0.1) dt = 0.1;

  interpState = interp(now);
  const s = interpState;

  if (s) {
    // giocatori: crea/aggiorna/rimuovi
    const seen = new Set();
    for (const p of s.players || []) {
      seen.add(p.id);
      updatePlayer3D(p, dt);
    }
    for (const [id, m] of playerMeshes) {
      if (!seen.has(id)) {
        world.remove(m.root);
        const ring = chargeRings.get(id);
        if (ring) { world.remove(ring); chargeRings.delete(id); }
        playerMeshes.delete(id);
        delete animStates[id];
      }
    }

    // hit zone per me
    const me = (s.players || []).find(p => p.id === myId);
    if (me && s.phase === 'rally') {
      const reach = serverState.hitReach || 4.0;
      hitZone.visible = hitZoneFill.visible = sweetZone.visible = true;
      hitZone.position.set(me.x, 0.02, me.z);
      hitZoneFill.position.set(me.x, 0.015, me.z);
      sweetZone.position.set(me.x, 0.022, me.z);
      hitZone.scale.set(reach, reach, 1);
      hitZoneFill.scale.set(reach, reach, 1);
      const perfectR = Math.max(0.35, 0.7 - (serverState.rallyCount || 0) * 0.02);
      sweetZone.scale.set(perfectR / 0.63, perfectR / 0.63, 1);
      const b = s.ball;
      const dist = b ? Math.hypot(b.x - me.x, b.z - me.z) : 999;
      const canHit = !!me.canHit;
      const near = !canHit && b && dist < reach * 1.9 && b.y < 6;
      const pulse = canHit ? 0.8 + 0.2 * Math.sin(now / 90) : 1;
      if (canHit) {
        hitZone.material.color.set(0x06d6a0); hitZone.material.opacity = 0.9 * pulse;
        hitZoneFill.material.color.set(0x06d6a0); hitZoneFill.material.opacity = 0.10;
      } else if (near) {
        hitZone.material.color.set(0xffd166); hitZone.material.opacity = 0.55;
        hitZoneFill.material.color.set(0xffd166); hitZoneFill.material.opacity = 0.05;
      } else {
        hitZone.material.color.set(0xffffff); hitZone.material.opacity = 0.18;
        hitZoneFill.material.color.set(0xffffff); hitZoneFill.material.opacity = 0.025;
      }
    } else {
      hitZone.visible = hitZoneFill.visible = sweetZone.visible = false;
    }

    // frecce di mira
    serveAim.visible = false;
    shotAim.visible = false;
    if (me && s.phase === 'serving' && s.serverId === myId && s.ball) {
      const flip = (myTeam === 'B') ? -1 : 1;
      const ax = (joy.x || 0) * flip;
      const box = s.serveBox || { xSign: 1, zSign: me.team === 'A' ? 1 : -1 };
      pointAim(serveAim, me.x, me.z, box.xSign * (COURT.SINGLES_HALF_W * 0.55) + ax * 1.6, box.zSign * (COURT.SERVICE_Z - 1.0));
    }
    if (me && charging && s.phase === 'rally') {
      const flip = (myTeam === 'B') ? -1 : 1;
      const ax = (joy.x || 0) * flip;
      const opp = me.team === 'A' ? 1 : -1;
      pointAim(shotAim, me.x, me.z, me.x + ax * 7, me.z + opp * 9);
    }

    // palla + traiettoria
    updateBall3D(s.ball, now);
    if (s.ball && s.phase === 'rally') updatePredictedPath(s.ball);
    else { updatePredictedPath(null); }

    updateCamera(s, dt);
  } else {
    // attesa in lobby: lenta panoramica
    const t = now / 9000;
    camera.position.set(Math.sin(t) * 16, 8.5, Math.cos(t) * 18);
    camera.lookAt(0, 0.5, 0);
  }

  stepParticles(dt);
  stepPops(dt);
  renderHud();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame((t) => { lastFrameT = t; frame(t); });
</script>
</body>
</html>
